services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"       # 5433 bahar, 5432 andar hi rahega
    environment:
      POSTGRES_DB: shortly
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: shortly
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"       # 6380 bahar

  web:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DB_HOST: db              # service ka naam, localhost nahi!
      DB_PORT: "5432"          # andar wala port
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata: